<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="craftsail growth">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="0.55" stop-color="#14b8a6"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#g)"/>
  <!-- jib: the smaller front sail -->
  <path d="M28.5 20.5 L28.5 43 L15.5 43 C18.5 35 22.5 27 28.5 20.5 Z" fill="#fff" fill-opacity=".72"/>
  <!-- main sail, taller: growth -->
  <path d="M32 11 L32 43 L49.5 43 C47.5 30.5 41.5 19 32 11 Z" fill="#fff"/>
  <!-- hull as a rising line -->
  <path d="M13 49.5 C24 53.5 38 53 51.5 45.5" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round"/>
</svg>
